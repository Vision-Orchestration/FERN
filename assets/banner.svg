<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      .mono { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
      .sans { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    </style>
  </defs>

  <!-- BG -->
  <rect width="900" height="280" fill="#0d1117"/>

  <!-- Subtle grid -->
  <g opacity="0.035" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="56" x2="900" y2="56"/>
    <line x1="0" y1="112" x2="900" y2="112"/>
    <line x1="0" y1="168" x2="900" y2="168"/>
    <line x1="0" y1="224" x2="900" y2="224"/>
    <line x1="180" y1="0" x2="180" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="540" y1="0" x2="540" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
  </g>

  <!-- ── SKELETON FIGURE (right side) ── -->

  <!-- bone lines first (behind joints) -->
  <!-- spine -->
  <line x1="748" y1="75" x2="748" y2="145" stroke="#58a6ff" stroke-width="1.5" opacity="0.35"/>
  <!-- shoulders -->
  <line x1="710" y1="95" x2="786" y2="95" stroke="#58a6ff" stroke-width="1.5" opacity="0.35"/>
  <!-- L arm -->
  <line x1="710" y1="95" x2="690" y2="130" stroke="#58a6ff" stroke-width="1.2" opacity="0.28"/>
  <line x1="690" y1="130" x2="678" y2="158" stroke="#58a6ff" stroke-width="1.2" opacity="0.22"/>
  <!-- R arm -->
  <line x1="786" y1="95" x2="806" y2="130" stroke="#58a6ff" stroke-width="1.2" opacity="0.28"/>
  <line x1="806" y1="130" x2="818" y2="158" stroke="#58a6ff" stroke-width="1.2" opacity="0.22"/>
  <!-- hips -->
  <line x1="725" y1="145" x2="771" y2="145" stroke="#3fb950" stroke-width="1.5" opacity="0.35"/>
  <!-- L leg -->
  <line x1="725" y1="145" x2="718" y2="195" stroke="#3fb950" stroke-width="1.5" opacity="0.32"/>
  <!-- R leg: kicked forward gesture -->
  <line x1="771" y1="145" x2="800" y2="188" stroke="#3fb950" stroke-width="1.5" opacity="0.32"/>
  <!-- L lower leg -->
  <line x1="718" y1="195" x2="712" y2="245" stroke="#f78166" stroke-width="2" opacity="0.55"/>
  <!-- R lower leg: kicking - stops at knee level -->
  <line x1="800" y1="188" x2="842" y2="175" stroke="#f78166" stroke-width="2" opacity="0.7"/>

  <!-- motion trail for kick -->
  <line x1="836" y1="178" x2="858" y2="172" stroke="#f78166" stroke-width="1.5" opacity="0.35" stroke-dasharray="3,3"/>
  <line x1="852" y1="175" x2="872" y2="170" stroke="#f78166" stroke-width="1" opacity="0.2" stroke-dasharray="2,4"/>

  <!-- joint dots -->
  <!-- head -->
  <circle cx="748" cy="62" r="8" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.7"/>
  <circle cx="748" cy="62" r="3" fill="#58a6ff" opacity="0.6"/>
  <!-- neck -->
  <circle cx="748" cy="75" r="3.5" fill="#58a6ff" opacity="0.5"/>
  <!-- L shoulder -->
  <circle cx="710" cy="95" r="5" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>
  <!-- R shoulder -->
  <circle cx="786" cy="95" r="5" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>
  <!-- L elbow -->
  <circle cx="690" cy="130" r="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.2" opacity="0.6"/>
  <!-- R elbow -->
  <circle cx="806" cy="130" r="4" fill="#21262d" stroke="#58a6ff" stroke-width="1.2" opacity="0.6"/>
  <!-- mid-hip -->
  <circle cx="748" cy="145" r="4" fill="#21262d" stroke="#3fb950" stroke-width="1.2" opacity="0.7"/>
  <!-- L hip -->
  <circle cx="725" cy="145" r="5" fill="#21262d" stroke="#3fb950" stroke-width="1.5" opacity="0.8"/>
  <!-- R hip -->
  <circle cx="771" cy="145" r="5" fill="#21262d" stroke="#3fb950" stroke-width="1.5" opacity="0.8"/>
  <!-- L knee -->
  <circle cx="718" cy="195" r="5" fill="#21262d" stroke="#3fb950" stroke-width="1.5" opacity="0.7"/>
  <!-- R knee (kick) -->
  <circle cx="800" cy="188" r="5" fill="#21262d" stroke="#f78166" stroke-width="1.5" opacity="0.8"/>
  <!-- L ankle -->
  <circle cx="712" cy="245" r="6" fill="#21262d" stroke="#f78166" stroke-width="2" opacity="0.9"/>
  <!-- R foot (kicked) - bright accent -->
  <circle cx="842" cy="175" r="7" fill="#f78166" opacity="0.9"/>
  <circle cx="842" cy="175" r="10" fill="none" stroke="#f78166" stroke-width="1" opacity="0.4"/>

  <!-- ── MEDIAPIPE BOUNDING BOX ── -->
  <rect x="668" y="40" width="220" height="235" rx="4" fill="none" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.2"/>
  <!-- corner ticks -->
  <line x1="668" y1="40" x2="684" y2="40" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="668" y1="40" x2="668" y2="56" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="888" y1="40" x2="872" y2="40" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="888" y1="40" x2="888" y2="56" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="668" y1="275" x2="684" y2="275" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="668" y1="275" x2="668" y2="259" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="888" y1="275" x2="872" y2="275" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="888" y1="275" x2="888" y2="259" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
  <!-- confidence label -->
  <text x="778" y="36" class="mono sans" font-size="9" fill="#3fb950" text-anchor="middle" opacity="0.7">foot_lift 0.97</text>

  <!-- ── LEFT PANEL: TITLE BLOCK ── -->
  <!-- top accent bar -->
  <rect x="52" y="0" width="3" height="280" fill="#58a6ff" opacity="0.8"/>

  <!-- eyebrow tag -->
  <rect x="66" y="36" width="130" height="20" rx="10" fill="#161b22"/>
  <rect x="66" y="36" width="130" height="20" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="131" y="50" class="mono sans" font-size="10" fill="#3fb950" text-anchor="middle" letter-spacing="1">VISION-ORCHESTRATION</text>

  <!-- FERN  big title -->
  <text x="66" y="138" class="sans" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-4">FERN</text>

  <!-- acronym expansion with highlighted letters -->
  <text x="68" y="168" class="sans" font-size="15" fill="#8b949e" letter-spacing="0.5">
    <tspan fill="#e6edf3" font-weight="600">F</tspan>
    <tspan>oot </tspan>
    <tspan fill="#e6edf3" font-weight="600">g</tspan>
    <tspan>E</tspan>
    <tspan fill="#e6edf3" font-weight="600">s</tspan>
    <tspan>ture </tspan>
    <tspan fill="#e6edf3" font-weight="600">R</tspan>
    <tspan>ecognition </tspan>
    <tspan fill="#e6edf3" font-weight="600">N</tspan>
    <tspan>etwork</tspan>
  </text>

  <!-- divider -->
  <line x1="66" y1="184" x2="630" y2="184" stroke="#30363d" stroke-width="1"/>

  <!-- stat pills row -->
  <!-- stat 1 -->
  <rect x="66" y="200" width="88" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="110" y="218" class="mono sans" font-size="18" font-weight="700" fill="#58a6ff" text-anchor="middle">86.3%</text>
  <text x="110" y="234" class="sans" font-size="9" fill="#484f58" text-anchor="middle" letter-spacing="0.5">ONNX ACC</text>

  <!-- stat 2 -->
  <rect x="162" y="200" width="88" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="206" y="218" class="mono sans" font-size="18" font-weight="700" fill="#58a6ff" text-anchor="middle">44.4%</text>
  <text x="206" y="234" class="sans" font-size="9" fill="#484f58" text-anchor="middle" letter-spacing="0.5">3-FOLD CV</text>

  <!-- stat 3 -->
  <rect x="258" y="200" width="88" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="302" y="218" class="mono sans" font-size="18" font-weight="700" fill="#3fb950" text-anchor="middle">∼526K</text>
  <text x="302" y="234" class="sans" font-size="9" fill="#484f58" text-anchor="middle" letter-spacing="0.5">PARAMS</text>

  <!-- stat 4 -->
  <rect x="354" y="200" width="88" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="398" y="218" class="mono sans" font-size="18" font-weight="700" fill="#3fb950" text-anchor="middle">10</text>
  <text x="398" y="234" class="sans" font-size="9" fill="#484f58" text-anchor="middle" letter-spacing="0.5">SUBJECTS</text>

  <!-- stat 5 -->
  <rect x="450" y="200" width="88" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="494" y="218" class="mono sans" font-size="18" font-weight="700" fill="#d29922" text-anchor="middle">8</text>
  <text x="494" y="234" class="sans" font-size="9" fill="#484f58" text-anchor="middle" letter-spacing="0.5">GESTURES</text>

  <!-- stat 6 -->
  <rect x="546" y="200" width="88" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="590" y="218" class="mono sans" font-size="18" font-weight="700" fill="#d29922" text-anchor="middle">CNN</text>
  <text x="590" y="234" class="sans" font-size="9" fill="#484f58" text-anchor="middle" letter-spacing="0.5">ARCH</text>

  <!-- version + alpha badge -->
  <text x="68" y="264" class="mono sans" font-size="11" fill="#484f58">v2.0 · Alpha · MIT · Python 3.11 · PyTorch 2.2</text>
</svg>
