  <line x1="760" y1="112" x2="740" y2="120" stroke="#3fb950" stroke-width="1.5" opacity="0.3"/>
  <line x1="760" y1="112" x2="780" y2="120" stroke="#3fb950" stroke-width="1.5" opacity="0.3"/>
  <line x1="740" y1="120" x2="735" y2="155" stroke="#3fb950" stroke-width="1.5" opacity="0.3"/>
  <line x1="780" y1="120" x2="785" y2="148" stroke="#3fb950" stroke-width="1.5" opacity="0.3"/>
  <line x1="735" y1="155" x2="730" y2="185" stroke="#f78166" stroke-width="2" opacity="0.5"/>
