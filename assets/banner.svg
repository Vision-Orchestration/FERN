  <circle cx="708" cy="105" r="3" fill="#58a6ff" opacity="0.4"/>
  <circle cx="694" cy="130" r="3" fill="#58a6ff" opacity="0.35"/>
  <line x1="730" y1="78" x2="708" y2="105" stroke="#58a6ff" stroke-width="1.2" opacity="0.25"/>
  <line x1="708" y1="105" x2="694" y2="130" stroke="#58a6ff" stroke-width="1.2" opacity="0.2"/>
  <!-- Grid dots subtle -->
  <g opacity="0.06">
    <circle cx="820" cy="30" r="1.5" fill="white"/>
    <circle cx="845" cy="30" r="1.5" fill="white"/>
    <circle cx="870" cy="30" r="1.5" fill="white"/>
