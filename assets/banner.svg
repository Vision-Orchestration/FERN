  <text x="60" y="170" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#58a6ff">93.67%</text>
  <text x="60" y="186" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" fill="#484f58">Top-1 Accuracy</text>
  <text x="170" y="170" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#58a6ff">98.73%</text>
  <text x="170" y="186" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" fill="#484f58">Top-3 Accuracy</text>
