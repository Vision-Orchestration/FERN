  <text x="280" y="186" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" fill="#484f58">Detection Rate</text>
  <text x="380" y="170" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#3fb950">823K</text>
  <text x="380" y="186" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" fill="#484f58">Parameters</text>
  <text x="465" y="170" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#d29922">35</text>
